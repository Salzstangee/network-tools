name: Build PingMon.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pystray pillow
      - name: Smoke test the ping engine on Windows
        shell: python
        run: |
          import socket, sys
          sys.path.insert(0, ".")
          import pingmon as p
          assert p._icmp is not None, "ICMP API not loaded"
          ok, ms, ttl = p.echo("127.0.0.1")
          assert ok and ttl == 128, ("loopback", ok, ms, ttl)
          assert p.echo("127.0.0.1", 1472, True)[0], "1472 bytes with DF"
          assert not p.echo("192.0.2.1")[0], "TEST-NET must not answer"
          assert not p.echo("no-such-host.invalid")[0]
          assert p.echo("::1")[0], "IPv6 through ping.exe"
          srv = socket.socket(); srv.bind(("127.0.0.1", 0)); srv.listen()
          assert p.ping(f"127.0.0.1:{srv.getsockname()[1]}")[0], "TCP check"
          print("engine ok", p.ping("127.0.0.1"), p.ping("::1"))
      - name: Smoke test the GUI module
        shell: python
        run: |
          import importlib.machinery, importlib.util, sys
          sys.path.insert(0, ".")
          loader = importlib.machinery.SourceFileLoader("gui", "pingmon_gui.pyw")
          gui = importlib.util.module_from_spec(importlib.util.spec_from_loader("gui", loader))
          loader.exec_module(gui)
          assert gui.version_tuple("v1.10") > gui.version_tuple("1.9")
          assert gui.dns_name("127.0.0.1"), "reverse lookup of loopback"
          gw, lo = gui.next_hop("8.8.8.8"), gui.next_hop("127.0.0.1")
          print(f"::notice::next hop to 8.8.8.8: {gw}, to 127.0.0.1: {lo}")
          assert gw and gw != "8.8.8.8" and lo is None, (gw, lo)
          print("gui ok", gui.VERSION, gui.dns_name("127.0.0.1"))
      - run: pyinstaller --onefile --windowed --name PingMon --icon pingmon.ico --hidden-import pystray._win32 pingmon_gui.pyw
      - name: Smoke test the exe, also as restarted by an update
        shell: python
        run: |
          import importlib.machinery, importlib.util, json, os, socket, subprocess, sys, time, traceback
          sys.path.insert(0, ".")
          exe = os.path.abspath(r"dist\PingMon.exe")

          def annotate(level, msg):     # annotations are readable through the API, logs are not
              msg = str(msg).encode("ascii", "replace").decode()
              print(f"::{level}::" + msg.replace("%", "%25").replace("\n", "%0A"), flush=True)

          def launch(cmd, env, wait=45):
              """Start PingMon; (answers on its single-instance port, still running, stderr)."""
              p = subprocess.Popen(cmd, env=env, stderr=subprocess.PIPE, text=True, errors="replace")
              ok, end = False, time.time() + wait
              while not ok and time.time() < end and p.poll() is None:
                  try:
                      with socket.create_connection(("127.0.0.1", gui.INSTANCE_PORT), timeout=2) as c:
                          c.sendall(b"pingmon-show\n")
                          ok = c.recv(16).startswith(b"ok")
                  except OSError:
                      time.sleep(1)
              alive = p.poll() is None
              subprocess.run(["taskkill", "/F", "/T", "/PID", str(p.pid)], capture_output=True)
              err = p.communicate()[1][-1500:]
              time.sleep(3)
              return ok, alive, err

          try:
              loader = importlib.machinery.SourceFileLoader("gui", "pingmon_gui.pyw")
              gui = importlib.util.module_from_spec(importlib.util.spec_from_loader("gui", loader))
              loader.exec_module(gui)
              ok, alive, err = launch([exe], dict(os.environ))
              if not ok:
                  _, _, src_err = launch([sys.executable, "pingmon_gui.pyw"], dict(os.environ), 30)
                  annotate("error", f"PingMon.exe did not answer (alive={alive}).\n"
                                    f"From source: {src_err or 'no output'}")
                  sys.exit(1)
              # what a running onefile exe hands to everything it starts, dumped by a probe exe
              with open("probe.py", "w") as fh:
                  fh.write("import json, os\n"
                           "print(json.dumps({k: v for k, v in os.environ.items() if k.startswith('_PYI')}))\n")
              subprocess.run(["pyinstaller", "--onefile", "--distpath", "probe", "--workpath", "probe/build",
                              "--specpath", "probe", "probe.py"], check=True, capture_output=True)
              inherited = json.loads(subprocess.run([r"probe\probe.exe"], capture_output=True, text=True,
                                                    check=True).stdout)
              inherited["_PYI_ARCHIVE_FILE"] = exe      # after an update the new exe has the old one's path
              ok, _, _ = launch([exe], dict(os.environ, **inherited))
              annotate("notice", f"restart with inherited {sorted(inherited)}: "
                                 f"{'starts' if ok else 'fails (the v1.2/v1.3 bug)'}")
              os.environ.update(inherited)
              ok, alive, _ = launch([exe], gui.clean_env())
              annotate("notice" if ok else "error", f"restart with clean_env(): {'starts' if ok else 'fails'}")
              sys.exit(0 if ok else 1)
          except Exception:
              annotate("error", traceback.format_exc()[-1500:])
              sys.exit(1)
      - uses: actions/upload-artifact@v4
        with:
          name: PingMon
          path: dist/PingMon.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PingMon.exe
